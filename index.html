<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f4f2ee" />
  <meta name="description" content="Liminal Journal — a minimal app for interstitial journaling. Log tiny steps, stay in the present." />
  <title>Liminal Journal</title>
  <style>
    /* Liminal Journal — calm “threshold” UI: warm paper, soft sage, low noise */
    :root {
      --bg: #f3efe7;
      --bg-soft: #ebe5d9;
      --bg-elevated: #fffcf7;
      --fg: #1a1916;
      --fg-muted: #6b675f;
      --fg-faint: #938e84;
      --border: #e0d9cc;
      --border-strong: #cfc6b6;
      --accent: #3d5c4a;
      --accent-soft: #e7f0ea;
      --accent-fg: #f7faf8;
      --danger: #9a4034;
      --danger-soft: #f7ebe8;
      --warn-bg: #f4ead0;
      --warn-fg: #5c4a1f;
      --shadow-sm: 0 1px 2px rgb(40 32 18 / 4%);
      --shadow-md: 0 4px 16px rgb(40 32 18 / 6%), 0 1px 3px rgb(40 32 18 / 4%);
      --shadow-lg: 0 18px 50px rgb(20 16 10 / 16%);
      --radius: 14px;
      --radius-sm: 10px;
      --radius-pill: 999px;
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
        "Segoe UI", system-ui, -apple-system, sans-serif;
      --font-ui: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --tap: 44px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --max: 36rem;
      --header-h: 3.75rem;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent);
    }

    html[data-theme="dark"] {
      --bg: #141311;
      --bg-soft: #1a1916;
      --bg-elevated: #1e1c19;
      --fg: #f0ebe3;
      --fg-muted: #a39e94;
      --fg-faint: #736e65;
      --border: #2e2b26;
      --border-strong: #403c35;
      --accent: #8fbc9f;
      --accent-soft: #243029;
      --accent-fg: #0f1612;
      --danger: #e8a399;
      --danger-soft: #2c1c19;
      --warn-bg: #2c2618;
      --warn-fg: #e8d7a4;
      --shadow-sm: 0 1px 2px rgb(0 0 0 / 28%);
      --shadow-md: 0 6px 20px rgb(0 0 0 / 28%), 0 1px 3px rgb(0 0 0 / 22%);
      --shadow-lg: 0 22px 56px rgb(0 0 0 / 45%);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--fg);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      padding-top: var(--safe-t);
      padding-bottom: calc(var(--safe-b) + 0.25rem);
      background:
        radial-gradient(120% 70% at 50% -10%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%),
        radial-gradient(80% 50% at 100% 20%, color-mix(in srgb, var(--bg-soft) 80%, transparent), transparent 50%),
        var(--bg);
      background-attachment: fixed;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      min-height: var(--tap);
      padding: 0.55rem 0.95rem;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease),
        transform 0.12s var(--ease), box-shadow 0.15s var(--ease);
      -webkit-tap-highlight-color: transparent;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        border-color: var(--border-strong);
        background: color-mix(in srgb, var(--bg-elevated) 88%, var(--bg-soft));
      }
    }

    button:active { transform: translateY(1px); }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
      font-weight: 600;
      letter-spacing: 0.01em;
      box-shadow: 0 1px 0 color-mix(in srgb, #000 12%, transparent), var(--shadow-sm);
    }

    @media (hover: hover) and (pointer: fine) {
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 92%, #000);
        border-color: transparent;
      }
    }

    button.ghost {
      background: transparent;
      box-shadow: none;
      border-color: transparent;
    }

    @media (hover: hover) and (pointer: fine) {
      button.ghost:hover {
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        border-color: transparent;
      }
    }

    button.danger {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: color-mix(in srgb, var(--danger) 22%, var(--border));
      box-shadow: none;
    }

    button.icon {
      width: var(--tap);
      min-width: var(--tap);
      padding: 0;
      display: inline-grid;
      place-items: center;
      font-size: 1.05rem;
      line-height: 1;
      color: var(--fg-muted);
      border-radius: var(--radius-sm);
    }

    button.icon svg {
      width: 1.15rem;
      height: 1.15rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wrap {
      width: min(100% - 1.5rem, var(--max));
      margin-inline: auto;
    }

    /* —— Header —— */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0.7rem 0 0.65rem;
      background: color-mix(in srgb, var(--bg) 78%, transparent);
      backdrop-filter: saturate(1.2) blur(14px);
      -webkit-backdrop-filter: saturate(1.2) blur(14px);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 85%, transparent);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 11px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(145deg, color-mix(in srgb, var(--accent) 18%, var(--bg-elevated)), var(--bg-elevated));
      border: 1px solid color-mix(in srgb, var(--accent) 22%, var(--border));
      box-shadow: var(--shadow-sm);
      color: var(--accent);
    }

    .brand-mark svg {
      width: 1.15rem;
      height: 1.15rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .brand-text { min-width: 0; }

    .brand h1 {
      margin: 0;
      font-family: var(--font);
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    .brand p {
      margin: 0.18rem 0 0;
      font-family: var(--font-ui);
      font-size: 0.78rem;
      line-height: 1.3;
      color: var(--fg-muted);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .header-actions {
      display: flex;
      gap: 0.2rem;
      align-items: center;
      flex: 0 0 auto;
      padding: 0.15rem;
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg-elevated) 70%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
    }

    .header-actions .icon {
      min-height: 2.4rem;
      width: 2.4rem;
      min-width: 2.4rem;
    }

    #btn-lang {
      font-family: var(--font-ui);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--fg);
    }

    #storage-warning {
      display: none;
      margin: 0.7rem auto 0;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm);
      background: var(--warn-bg);
      color: var(--warn-fg);
      border: 1px solid color-mix(in srgb, var(--warn-fg) 18%, transparent);
      font-size: 0.86rem;
      line-height: 1.4;
    }

    #storage-warning.visible { display: block; }

    /* —— Day nav —— */
    .day-nav {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      margin: 1rem auto 0.35rem;
      padding: 0.3rem;
      border-radius: 16px;
      background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
    }

    .day-nav .icon {
      border: none;
      box-shadow: none;
      background: transparent;
      color: var(--fg);
    }

    .day-nav input[type="date"] {
      flex: 1;
      min-width: 0;
      min-height: 2.5rem;
      border: none;
      border-radius: var(--radius-sm);
      background: transparent;
      padding: 0.35rem 0.4rem;
      font-family: var(--font-ui);
      font-size: 0.95rem;
      font-weight: 500;
      font-variant-numeric: tabular-nums;
      color: var(--fg);
      box-shadow: none;
    }

    .day-nav input[type="date"]:focus-visible {
      background: color-mix(in srgb, var(--accent) 8%, transparent);
    }

    #btn-today {
      flex: 0 0 auto;
      min-height: 2.35rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
      background: var(--accent-soft);
      color: var(--accent);
      box-shadow: none;
    }

    /* —— Log —— */
    main#log {
      padding: 0.65rem 0 13.5rem;
      min-height: 42vh;
    }

    .empty {
      margin: 2.75rem auto 1.5rem;
      max-width: 18rem;
      text-align: center;
      color: var(--fg-muted);
      padding: 1.5rem 1rem;
    }

    .empty-glyph {
      width: 3.25rem;
      height: 3.25rem;
      margin: 0 auto 1rem;
      border-radius: 50%;
      border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--border));
      display: grid;
      place-items: center;
      color: var(--accent);
      opacity: 0.85;
    }

    .empty-glyph svg {
      width: 1.35rem;
      height: 1.35rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
    }

    .empty p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--fg-muted);
    }

    .entry {
      position: relative;
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.65rem 0.85rem;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.95rem 0.95rem 0.95rem 0.9rem;
      margin: 0 0 0.7rem;
      box-shadow: var(--shadow-sm);
      transition: border-color 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }

    .entry::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.85rem;
      bottom: 0.85rem;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: color-mix(in srgb, var(--accent) 55%, var(--border));
      opacity: 0.75;
    }

    .entry-time {
      grid-column: 1;
      grid-row: 1;
      align-self: start;
      margin-top: 0.12rem;
      font-family: var(--mono);
      font-size: 0.78rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
      background: color-mix(in srgb, var(--bg-soft) 70%, var(--bg-elevated));
      border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
      border-radius: var(--radius-pill);
      padding: 0.22rem 0.55rem;
      line-height: 1.2;
    }

    .entry-actions {
      grid-column: 2;
      grid-row: 1;
      display: flex;
      gap: 0.15rem;
      justify-content: flex-end;
      align-items: center;
    }

    .entry-actions button {
      min-height: 2rem;
      padding: 0.2rem 0.55rem;
      font-size: 0.78rem;
      font-weight: 500;
      border: none;
      box-shadow: none;
      background: transparent;
      color: var(--fg-faint);
      border-radius: 8px;
    }

    @media (hover: hover) and (pointer: fine) {
      .entry-actions button:hover {
        color: var(--fg);
        background: color-mix(in srgb, var(--fg) 6%, transparent);
      }
      .entry-actions button.danger:hover {
        color: var(--danger);
        background: var(--danger-soft);
      }
    }

    .entry-actions button.danger {
      color: var(--fg-faint);
      background: transparent;
      border: none;
    }

    .entry-text {
      grid-column: 1 / -1;
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.48;
      letter-spacing: -0.01em;
      color: var(--fg);
    }

    .entry.editing {
      grid-template-columns: 1fr;
      gap: 0.55rem;
      border-color: color-mix(in srgb, var(--accent) 35%, var(--border));
      box-shadow: var(--shadow-md);
    }

    .entry.editing .entry-time { justify-self: start; }

    .entry.editing textarea {
      width: 100%;
      min-height: 5.5rem;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      padding: 0.75rem 0.85rem;
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.45;
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 3%);
    }

    .entry-edit-actions {
      display: flex;
      gap: 0.45rem;
      justify-content: flex-end;
    }

    /* —— Composer dock —— */
    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 0.55rem 0 calc(0.55rem + var(--safe-b));
      background:
        linear-gradient(to top, color-mix(in srgb, var(--bg) 96%, transparent) 55%, transparent);
      pointer-events: none;
    }

    .composer-shell {
      pointer-events: auto;
      border-radius: 18px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
      backdrop-filter: blur(16px) saturate(1.15);
      -webkit-backdrop-filter: blur(16px) saturate(1.15);
      box-shadow: var(--shadow-md);
      padding: 0.7rem 0.75rem 0.75rem;
    }

    .composer-inner {
      display: grid;
      gap: 0.55rem;
    }

    #composer-text {
      width: 100%;
      min-height: 4.75rem;
      max-height: 10rem;
      resize: vertical;
      border: 1px solid transparent;
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg) 55%, var(--bg-elevated));
      padding: 0.8rem 0.85rem;
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.45;
      letter-spacing: -0.01em;
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 3%);
      transition: border-color 0.15s var(--ease), background 0.15s var(--ease), box-shadow 0.15s var(--ease);
    }

    #composer-text::placeholder {
      color: var(--fg-faint);
      opacity: 1;
    }

    #composer-text:focus {
      border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
      background: var(--bg-elevated);
      box-shadow: var(--focus);
      outline: none;
    }

    .composer-row {
      display: flex;
      gap: 0.55rem;
      align-items: center;
    }

    .composer-row .primary {
      flex: 1;
      min-height: 2.75rem;
      border-radius: 12px;
      font-size: 0.98rem;
    }

    .hint {
      font-size: 0.72rem;
      color: var(--fg-faint);
      display: none;
    }

    /* —— Dialogs —— */
    dialog {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--bg-elevated);
      color: var(--fg);
      padding: 0;
      width: min(calc(100% - 2rem), 22.5rem);
      box-shadow: var(--shadow-lg);
    }

    dialog::backdrop {
      background: rgb(18 16 12 / 42%);
      backdrop-filter: blur(3px);
    }

    .dialog-body {
      padding: 1.2rem 1.2rem 0.85rem;
    }

    .dialog-body h2 {
      margin: 0 0 0.4rem;
      font-family: var(--font);
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .dialog-body p {
      margin: 0 0 0.65rem;
      color: var(--fg-muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: flex-end;
      padding: 0 1.15rem 1.15rem;
    }

    .menu-list {
      display: grid;
      gap: 0.4rem;
      margin: 0.65rem 0 0;
    }

    .menu-list button {
      width: 100%;
      text-align: left;
      justify-content: flex-start;
      border-radius: 12px;
      min-height: 2.85rem;
      font-weight: 500;
    }

    .menu-credit {
      margin: 0.95rem 0 0;
      font-size: 0.78rem;
      color: var(--fg-muted);
      line-height: 1.45;
    }

    .menu-credit a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
      text-decoration-thickness: 1px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(11.25rem + var(--safe-b));
      transform: translateX(-50%) translateY(6px);
      z-index: 40;
      background: color-mix(in srgb, var(--fg) 94%, var(--accent));
      color: var(--bg);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
      max-width: min(90vw, 22rem);
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .toast.show {
      opacity: 0.96;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 640px) {
      .brand p {
        font-size: 0.82rem;
        -webkit-line-clamp: 1;
      }
      .composer-row .primary {
        flex: 0 0 auto;
        min-width: 8.5rem;
      }
      .hint { display: block; flex: 1; }
      .entry:hover {
        border-color: var(--border-strong);
        box-shadow: var(--shadow-md);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="wrap header-row">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <!-- Threshold / dawn mark: soft horizon -->
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 15.5c2.8-3.2 5.4-4.8 8-4.8s5.2 1.6 8 4.8" />
            <circle cx="12" cy="9" r="2.1" fill="currentColor" stroke="none" />
          </svg>
        </div>
        <div class="brand-text">
          <h1 id="app-title">Liminal Journal</h1>
          <p id="app-subtitle"></p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="icon ghost" id="btn-theme" aria-label="Theme" title="Theme">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/><circle cx="12" cy="12" r="3.5"/></svg>
        </button>
        <button type="button" class="icon ghost" id="btn-lang" aria-label="Language" title="Language">EN</button>
        <button type="button" class="icon ghost" id="btn-menu" aria-label="Menu" title="Menu" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.2" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.2" fill="currentColor" stroke="none"/></svg>
        </button>
      </div>
    </div>
    <div class="wrap" id="storage-warning" role="status"></div>
  </header>

  <div class="wrap day-nav" role="navigation" aria-label="Day">
    <button type="button" class="icon" id="btn-prev-day" aria-label="Previous day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6L8.5 12l6 6"/></svg>
    </button>
    <label class="sr-only" for="day-picker">Day</label>
    <input type="date" id="day-picker" />
    <button type="button" class="icon" id="btn-next-day" aria-label="Next day">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
    </button>
    <button type="button" id="btn-today" hidden></button>
  </div>

  <main class="wrap" id="log" aria-live="polite"></main>

  <div class="composer">
    <div class="wrap">
      <div class="composer-shell">
        <div class="composer-inner">
          <label class="sr-only" for="composer-text" id="composer-label">Entry</label>
          <textarea id="composer-text" rows="3" autocomplete="off" enterkeyhint="enter"></textarea>
          <div class="composer-row">
            <span class="hint" id="composer-hint"></span>
            <button type="button" class="primary" id="btn-save"></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog id="menu-dialog">
    <div class="dialog-body">
      <h2 id="menu-title"></h2>
      <div class="menu-list">
        <button type="button" id="btn-download"></button>
        <button type="button" id="btn-restore"></button>
        <button type="button" id="btn-share-day"></button>
      </div>
      <p class="menu-credit" id="menu-credit"></p>
      <p class="menu-credit">
        <a id="link-inspiration" href="https://www.youtube.com/watch?v=UFidZJhxz84" target="_blank" rel="noopener noreferrer"></a>
      </p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-menu-close"></button>
    </div>
  </dialog>

  <dialog id="restore-dialog">
    <div class="dialog-body">
      <h2 id="restore-title"></h2>
      <p id="restore-summary"></p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-restore-cancel"></button>
      <button type="button" class="danger" id="btn-restore-replace"></button>
      <button type="button" class="primary" id="btn-restore-merge"></button>
    </div>
  </dialog>

  <dialog id="confirm-dialog">
    <div class="dialog-body">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
    </div>
    <div class="dialog-actions">
      <button type="button" class="ghost" id="btn-confirm-cancel"></button>
      <button type="button" class="danger" id="btn-confirm-ok"></button>
    </div>
  </dialog>

  <input type="file" id="file-input" accept="application/json,.json" hidden />

  <script>
(function () {
  "use strict";

  const STORAGE_KEY = "liminal-journal:v1";
  const SOFT_BYTES = 1.5 * 1024 * 1024;
  const SOFT_COUNT = 1500;

  const I18N = {
    en: {
      title: "Liminal Journal",
      subtitle: "What are you doing right now? Keep the next step tiny.",
      placeholder: "e.g. Opened the project folder",
      save: "Save",
      empty: "No entries this day. Write a micro-step and tap Save.",
      download: "Download backup",
      restore: "Restore backup",
      shareDay: "Share this day",
      merge: "Merge with existing",
      replace: "Replace everything",
      storageWarn: "Backup recommended — storage is getting full. Saving still works.",
      menu: "Menu",
      close: "Close",
      cancel: "Cancel",
      today: "Today",
      edit: "Edit",
      delete: "Delete",
      saveEdit: "Save",
      deleteTitle: "Delete entry?",
      deleteMsg: "This cannot be undone.",
      confirmOk: "OK",
      restoreTitle: "Restore backup",
      restoreSummary: "{count} entries · {from} → {to}",
      restoreEmpty: "This file has no entries.",
      restoreBad: "Could not read that backup file.",
      saved: "Saved",
      restored: "Restored",
      shared: "Shared",
      copied: "Copied to clipboard",
      downloaded: "Backup downloaded",
      theme: "Theme",
      lang: "Language",
      prevDay: "Previous day",
      nextDay: "Next day",
      shortcut: "⌘/Ctrl+Enter to save",
      replaceConfirmTitle: "Replace everything?",
      replaceConfirmMsg: "Your current journal will be replaced by this backup.",
      inspiredBy: "Inspired by interstitial journaling for ADHD.",
      inspirationLink: "Watch: Novie by the Sea (YouTube)",
    },
    it: {
      title: "Liminal Journal",
      subtitle: "Cosa stai facendo adesso? Il prossimo passo, piccolissimo.",
      placeholder: "es. Ho aperto la cartella del progetto",
      save: "Salva",
      empty: "Nessuna voce in questo giorno. Scrivi un micro-passo e tocca Salva.",
      download: "Scarica backup",
      restore: "Ripristina backup",
      shareDay: "Condividi questo giorno",
      merge: "Unisci a quelli esistenti",
      replace: "Sostituisci tutto",
      storageWarn: "Ti consiglio un backup — lo spazio si sta riempiendo. Puoi comunque salvare.",
      menu: "Menu",
      close: "Chiudi",
      cancel: "Annulla",
      today: "Oggi",
      edit: "Modifica",
      delete: "Elimina",
      saveEdit: "Salva",
      deleteTitle: "Eliminare la voce?",
      deleteMsg: "Questa azione non si può annullare.",
      confirmOk: "OK",
      restoreTitle: "Ripristina backup",
      restoreSummary: "{count} voci · {from} → {to}",
      restoreEmpty: "Questo file non contiene voci.",
      restoreBad: "Impossibile leggere questo backup.",
      saved: "Salvato",
      restored: "Ripristinato",
      shared: "Condiviso",
      copied: "Copiato negli appunti",
      downloaded: "Backup scaricato",
      theme: "Tema",
      lang: "Lingua",
      prevDay: "Giorno precedente",
      nextDay: "Giorno successivo",
      shortcut: "⌘/Ctrl+Invio per salvare",
      replaceConfirmTitle: "Sostituire tutto?",
      replaceConfirmMsg: "Il diario attuale verrà sostituito da questo backup.",
      inspiredBy: "Ispirato all’interstitial journaling per l’ADHD.",
      inspirationLink: "Guarda: Novie by the Sea (YouTube)",
    },
  };

  /** @type {{version:number, entries: Array<{id:string,ts:string,updatedAt:?string,text:string}>, settings:{theme:string,lang:string}}} */
  let state = defaultState();
  let selectedDay = localDateKey(new Date());
  let pendingRestore = null;
  let confirmResolver = null;
  let editingId = null;
  let toastTimer = null;

  const el = {
    title: document.getElementById("app-title"),
    subtitle: document.getElementById("app-subtitle"),
    storageWarning: document.getElementById("storage-warning"),
    dayPicker: document.getElementById("day-picker"),
    btnPrev: document.getElementById("btn-prev-day"),
    btnNext: document.getElementById("btn-next-day"),
    btnToday: document.getElementById("btn-today"),
    log: document.getElementById("log"),
    composer: document.getElementById("composer-text"),
    composerHint: document.getElementById("composer-hint"),
    btnSave: document.getElementById("btn-save"),
    btnTheme: document.getElementById("btn-theme"),
    btnLang: document.getElementById("btn-lang"),
    btnMenu: document.getElementById("btn-menu"),
    menuDialog: document.getElementById("menu-dialog"),
    menuTitle: document.getElementById("menu-title"),
    btnDownload: document.getElementById("btn-download"),
    btnRestore: document.getElementById("btn-restore"),
    btnShareDay: document.getElementById("btn-share-day"),
    btnMenuClose: document.getElementById("btn-menu-close"),
    menuCredit: document.getElementById("menu-credit"),
    linkInspiration: document.getElementById("link-inspiration"),
    restoreDialog: document.getElementById("restore-dialog"),
    restoreTitle: document.getElementById("restore-title"),
    restoreSummary: document.getElementById("restore-summary"),
    btnRestoreCancel: document.getElementById("btn-restore-cancel"),
    btnRestoreMerge: document.getElementById("btn-restore-merge"),
    btnRestoreReplace: document.getElementById("btn-restore-replace"),
    confirmDialog: document.getElementById("confirm-dialog"),
    confirmTitle: document.getElementById("confirm-title"),
    confirmMessage: document.getElementById("confirm-message"),
    btnConfirmCancel: document.getElementById("btn-confirm-cancel"),
    btnConfirmOk: document.getElementById("btn-confirm-ok"),
    fileInput: document.getElementById("file-input"),
    toast: document.getElementById("toast"),
  };

  function defaultState() {
    return {
      version: 1,
      entries: [],
      settings: {
        theme: "system",
        lang: detectLang(),
      },
    };
  }

  function detectLang() {
    const nav = (navigator.language || "en").toLowerCase();
    return nav.startsWith("it") ? "it" : "en";
  }

  function t(key) {
    const lang = state.settings.lang === "it" ? "it" : "en";
    return I18N[lang][key] || I18N.en[key] || key;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || typeof data !== "object") return;
      state = {
        version: 1,
        entries: Array.isArray(data.entries) ? data.entries.filter(validEntry) : [],
        settings: {
          theme: normalizeTheme(data.settings && data.settings.theme),
          lang: data.settings && data.settings.lang === "it" ? "it" : (data.settings && data.settings.lang === "en" ? "en" : detectLang()),
        },
      };
    } catch (_) {
      /* keep defaults */
    }
  }

  function validEntry(e) {
    return e && typeof e.id === "string" && typeof e.ts === "string" && typeof e.text === "string";
  }

  function normalizeTheme(v) {
    return v === "light" || v === "dark" || v === "system" ? v : "system";
  }

  function persist() {
    const payload = JSON.stringify({
      version: 1,
      entries: state.entries,
      settings: state.settings,
    });
    try {
      localStorage.setItem(STORAGE_KEY, payload);
    } catch (_) {
      /* quota — still keep in-memory; soft warning covers this */
    }
    updateStorageWarning(payload.length);
  }

  function updateStorageWarning(bytes) {
    const n = state.entries.length;
    const show = bytes >= SOFT_BYTES || n >= SOFT_COUNT;
    el.storageWarning.textContent = t("storageWarn");
    el.storageWarning.classList.toggle("visible", show);
  }

  function applyTheme() {
    const pref = state.settings.theme;
    let theme = pref;
    if (pref === "system") {
      theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", theme);
    const meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", theme === "dark" ? "#141311" : "#f3efe7");
  }

  function applyI18n() {
    document.documentElement.lang = state.settings.lang === "it" ? "it" : "en";
    el.title.textContent = t("title");
    el.subtitle.textContent = t("subtitle");
    el.composer.placeholder = t("placeholder");
    el.btnSave.textContent = t("save");
    el.composerHint.textContent = t("shortcut");
    el.menuTitle.textContent = t("menu");
    el.btnDownload.textContent = t("download");
    el.btnRestore.textContent = t("restore");
    el.btnShareDay.textContent = t("shareDay");
    el.btnMenuClose.textContent = t("close");
    el.menuCredit.textContent = t("inspiredBy");
    el.linkInspiration.textContent = t("inspirationLink");
    el.restoreTitle.textContent = t("restoreTitle");
    el.btnRestoreCancel.textContent = t("cancel");
    el.btnRestoreMerge.textContent = t("merge");
    el.btnRestoreReplace.textContent = t("replace");
    el.btnToday.textContent = t("today");
    el.btnTheme.setAttribute("aria-label", t("theme"));
    el.btnTheme.title = t("theme");
    el.btnLang.setAttribute("aria-label", t("lang"));
    el.btnLang.title = t("lang");
    el.btnLang.textContent = state.settings.lang === "it" ? "IT" : "EN";
    el.btnPrev.setAttribute("aria-label", t("prevDay"));
    el.btnNext.setAttribute("aria-label", t("nextDay"));
    el.btnMenu.setAttribute("aria-label", t("menu"));
    document.title = t("title");
  }

  function localDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function parseLocalDay(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d, 12, 0, 0, 0);
  }

  function shiftDay(key, delta) {
    const d = parseLocalDay(key);
    d.setDate(d.getDate() + delta);
    return localDateKey(d);
  }

  function entryDayKey(entry) {
    const d = new Date(entry.ts);
    if (Number.isNaN(d.getTime())) return "";
    return localDateKey(d);
  }

  function formatTime(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "--:--";
    return d.toLocaleTimeString(state.settings.lang === "it" ? "it-IT" : "en-GB", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    });
  }

  function nowIso() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? "+" : "-";
    const oh = pad(Math.floor(Math.abs(off) / 60));
    const om = pad(Math.abs(off) % 60);
    return (
      d.getFullYear() +
      "-" + pad(d.getMonth() + 1) +
      "-" + pad(d.getDate()) +
      "T" + pad(d.getHours()) +
      ":" + pad(d.getMinutes()) +
      ":" + pad(d.getSeconds()) +
      sign + oh + ":" + om
    );
  }

  function uid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function entriesForDay(dayKey) {
    return state.entries
      .filter((e) => entryDayKey(e) === dayKey)
      .sort((a, b) => (a.ts < b.ts ? 1 : a.ts > b.ts ? -1 : 0));
  }

  function setSelectedDay(key) {
    selectedDay = key;
    el.dayPicker.value = key;
    const today = localDateKey(new Date());
    el.btnToday.hidden = key === today;
    renderLog();
  }

  function renderLog() {
    const list = entriesForDay(selectedDay);
    el.log.innerHTML = "";
    if (!list.length) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.innerHTML =
        '<div class="empty-glyph" aria-hidden="true">' +
        '<svg viewBox="0 0 24 24"><path d="M5 16c3-3.5 5.5-5 7-5s4 1.5 7 5"/><path d="M8 9h.01M12 7h.01M16 9h.01"/></svg>' +
        "</div>";
      const p = document.createElement("p");
      p.textContent = t("empty");
      empty.appendChild(p);
      el.log.appendChild(empty);
      return;
    }
    for (const entry of list) {
      el.log.appendChild(renderEntry(entry));
    }
  }

  function renderEntry(entry) {
    const card = document.createElement("article");
    card.className = "entry" + (editingId === entry.id ? " editing" : "");
    card.dataset.id = entry.id;

    const time = document.createElement("div");
    time.className = "entry-time";
    time.textContent = formatTime(entry.ts);

    if (editingId === entry.id) {
      const ta = document.createElement("textarea");
      ta.value = entry.text;
      ta.setAttribute("aria-label", t("edit"));

      const editActions = document.createElement("div");
      editActions.className = "entry-edit-actions";

      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "ghost";
      cancel.textContent = t("cancel");
      cancel.addEventListener("click", () => {
        editingId = null;
        renderLog();
      });

      const save = document.createElement("button");
      save.type = "button";
      save.className = "primary";
      save.textContent = t("saveEdit");
      save.addEventListener("click", () => {
        const text = ta.value.replace(/\s+$/g, "");
        if (!text.trim()) return;
        updateEntry(entry.id, text);
        editingId = null;
        renderLog();
        toast(t("saved"));
      });

      editActions.append(cancel, save);
      card.append(time, ta, editActions);
      queueMicrotask(() => ta.focus());
      return card;
    }

    const actions = document.createElement("div");
    actions.className = "entry-actions";

    const btnEdit = document.createElement("button");
    btnEdit.type = "button";
    btnEdit.className = "ghost";
    btnEdit.textContent = t("edit");
    btnEdit.addEventListener("click", () => {
      editingId = entry.id;
      renderLog();
    });

    const btnDel = document.createElement("button");
    btnDel.type = "button";
    btnDel.className = "ghost danger";
    btnDel.textContent = t("delete");
    btnDel.addEventListener("click", async () => {
      const ok = await askConfirm(t("deleteTitle"), t("deleteMsg"), t("delete"));
      if (!ok) return;
      deleteEntry(entry.id);
      renderLog();
    });

    actions.append(btnEdit, btnDel);

    const body = document.createElement("p");
    body.className = "entry-text";
    body.textContent = entry.text;

    card.append(time, actions, body);
    return card;
  }

  function saveComposer() {
    const text = el.composer.value.replace(/\s+$/g, "");
    if (!text.trim()) return;

    // If viewing another day, stamp time as noon local on that day (backfill),
    // but if viewing today use real now.
    const today = localDateKey(new Date());
    let ts = nowIso();
    if (selectedDay !== today) {
      const d = parseLocalDay(selectedDay);
      const now = new Date();
      d.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
      ts = isoFromDate(d);
    }

    state.entries.push({
      id: uid(),
      ts: ts,
      updatedAt: null,
      text: text,
    });
    persist();
    el.composer.value = "";
    renderLog();
    toast(t("saved"));
  }

  function isoFromDate(d) {
    const pad = (n) => String(n).padStart(2, "0");
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? "+" : "-";
    const oh = pad(Math.floor(Math.abs(off) / 60));
    const om = pad(Math.abs(off) % 60);
    return (
      d.getFullYear() +
      "-" + pad(d.getMonth() + 1) +
      "-" + pad(d.getDate()) +
      "T" + pad(d.getHours()) +
      ":" + pad(d.getMinutes()) +
      ":" + pad(d.getSeconds()) +
      sign + oh + ":" + om
    );
  }

  function updateEntry(id, text) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    e.text = text;
    e.updatedAt = nowIso();
    persist();
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter((x) => x.id !== id);
    if (editingId === id) editingId = null;
    persist();
  }

  function downloadBackup() {
    const blob = new Blob(
      [
        JSON.stringify(
          {
            version: 1,
            exportedAt: nowIso(),
            entries: state.entries,
            settings: state.settings,
          },
          null,
          2
        ),
      ],
      { type: "application/json" }
    );
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "liminal-journal-backup-" + localDateKey(new Date()) + ".json";
    a.click();
    URL.revokeObjectURL(a.href);
    toast(t("downloaded"));
  }

  function dayPlainText(dayKey) {
    const list = entriesForDay(dayKey).slice().reverse(); // chronological for share
    const lines = list.map((e) => formatTime(e.ts) + " — " + e.text);
    return "Liminal Journal — " + dayKey + "\n\n" + (lines.length ? lines.join("\n\n") : "");
  }

  async function shareDay() {
    const text = dayPlainText(selectedDay);
    const title = "Liminal Journal — " + selectedDay;
    if (navigator.share) {
      try {
        await navigator.share({ title: title, text: text });
        toast(t("shared"));
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      toast(t("copied"));
    } catch (_) {
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "liminal-journal-" + selectedDay + ".txt";
      a.click();
      URL.revokeObjectURL(a.href);
      toast(t("downloaded"));
    }
  }

  function openRestorePicker() {
    el.fileInput.value = "";
    el.fileInput.click();
  }

  function onFileChosen(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(String(reader.result || ""));
        const entries = Array.isArray(data.entries) ? data.entries.filter(validEntry) : [];
        if (!entries.length) {
          toast(t("restoreEmpty"));
          return;
        }
        const days = entries.map(entryDayKey).filter(Boolean).sort();
        pendingRestore = {
          entries: entries,
          settings: data.settings || null,
        };
        el.restoreSummary.textContent = t("restoreSummary")
          .replace("{count}", String(entries.length))
          .replace("{from}", days[0] || "—")
          .replace("{to}", days[days.length - 1] || "—");
        el.restoreDialog.showModal();
      } catch (_) {
        toast(t("restoreBad"));
      }
    };
    reader.readAsText(file);
  }

  function mergeRestore() {
    if (!pendingRestore) return;
    const map = new Map(state.entries.map((e) => [e.id, e]));
    for (const e of pendingRestore.entries) {
      map.set(e.id, e);
    }
    state.entries = Array.from(map.values());
    pendingRestore = null;
    persist();
    el.restoreDialog.close();
    renderLog();
    toast(t("restored"));
  }

  async function replaceRestore() {
    if (!pendingRestore) return;
    const ok = await askConfirm(t("replaceConfirmTitle"), t("replaceConfirmMsg"), t("replace"));
    if (!ok) return;
    state.entries = pendingRestore.entries.slice();
    if (pendingRestore.settings) {
      state.settings.theme = normalizeTheme(pendingRestore.settings.theme);
      if (pendingRestore.settings.lang === "it" || pendingRestore.settings.lang === "en") {
        state.settings.lang = pendingRestore.settings.lang;
      }
    }
    pendingRestore = null;
    persist();
    applyTheme();
    applyI18n();
    el.restoreDialog.close();
    renderLog();
    toast(t("restored"));
  }

  function askConfirm(title, message, okLabel) {
    el.confirmTitle.textContent = title;
    el.confirmMessage.textContent = message;
    el.btnConfirmCancel.textContent = t("cancel");
    el.btnConfirmOk.textContent = okLabel || t("confirmOk");
    el.confirmDialog.showModal();
    return new Promise((resolve) => {
      confirmResolver = resolve;
    });
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1800);
  }

  function cycleTheme() {
    const order = ["system", "light", "dark"];
    const i = order.indexOf(state.settings.theme);
    state.settings.theme = order[(i + 1) % order.length];
    persist();
    applyTheme();
  }

  function toggleLang() {
    state.settings.lang = state.settings.lang === "it" ? "en" : "it";
    persist();
    applyI18n();
    renderLog();
  }

  function bind() {
    el.btnSave.addEventListener("click", saveComposer);
    el.composer.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "Enter") {
        e.preventDefault();
        saveComposer();
      }
    });

    el.dayPicker.addEventListener("change", () => {
      if (el.dayPicker.value) setSelectedDay(el.dayPicker.value);
    });
    el.btnPrev.addEventListener("click", () => setSelectedDay(shiftDay(selectedDay, -1)));
    el.btnNext.addEventListener("click", () => setSelectedDay(shiftDay(selectedDay, 1)));
    el.btnToday.addEventListener("click", () => setSelectedDay(localDateKey(new Date())));

    el.btnTheme.addEventListener("click", cycleTheme);
    el.btnLang.addEventListener("click", toggleLang);

    el.btnMenu.addEventListener("click", () => el.menuDialog.showModal());
    el.btnMenuClose.addEventListener("click", () => el.menuDialog.close());
    el.btnDownload.addEventListener("click", () => {
      el.menuDialog.close();
      downloadBackup();
    });
    el.btnRestore.addEventListener("click", () => {
      el.menuDialog.close();
      openRestorePicker();
    });
    el.btnShareDay.addEventListener("click", () => {
      el.menuDialog.close();
      shareDay();
    });

    el.fileInput.addEventListener("change", () => {
      const f = el.fileInput.files && el.fileInput.files[0];
      onFileChosen(f);
    });

    el.btnRestoreCancel.addEventListener("click", () => {
      pendingRestore = null;
      el.restoreDialog.close();
    });
    el.btnRestoreMerge.addEventListener("click", mergeRestore);
    el.btnRestoreReplace.addEventListener("click", replaceRestore);

    el.btnConfirmCancel.addEventListener("click", () => {
      el.confirmDialog.close();
      if (confirmResolver) {
        confirmResolver(false);
        confirmResolver = null;
      }
    });
    el.btnConfirmOk.addEventListener("click", () => {
      el.confirmDialog.close();
      if (confirmResolver) {
        confirmResolver(true);
        confirmResolver = null;
      }
    });

    el.confirmDialog.addEventListener("close", () => {
      if (confirmResolver) {
        confirmResolver(false);
        confirmResolver = null;
      }
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.settings.theme === "system") applyTheme();
    });
  }

  function init() {
    load();
    bind();
    applyTheme();
    applyI18n();
    setSelectedDay(localDateKey(new Date()));
    try {
      const raw = localStorage.getItem(STORAGE_KEY) || "";
      updateStorageWarning(raw.length);
    } catch (_) {
      updateStorageWarning(0);
    }
  }

  init();
})();
  </script>
</body>
</html>
