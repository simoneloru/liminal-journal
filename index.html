<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f3efe7" />
  <meta name="description" content="Liminal Journal — a minimal app for interstitial journaling. Log tiny steps, stay in the present." />
  <title>Liminal Journal</title>
  <style>
    /* Calm liminal UI: ambient isometric room, low chrome, clear hierarchy */
    :root {
      --bg: #f3efe7;
      --bg-soft: #e9e3d6;
      --bg-elevated: #fffcf7;
      --fg: #1a1916;
      --fg-muted: #6b675f;
      --fg-faint: #938e84;
      --border: #ddd5c6;
      --border-strong: #c9bfad;
      --accent: #3d5c4a;
      --accent-soft: #e4efe8;
      --accent-fg: #f7faf8;
      --danger: #9a4034;
      --danger-soft: #f7ebe8;
      --warn-bg: #f4ead0;
      --warn-fg: #5c4a1f;
      --grid: color-mix(in srgb, var(--accent) 14%, var(--border));
      --shadow-sm: 0 1px 2px rgb(40 32 18 / 5%);
      --shadow-md: 0 8px 28px rgb(40 32 18 / 8%), 0 1px 3px rgb(40 32 18 / 5%);
      --shadow-lg: 0 22px 56px rgb(20 16 10 / 18%);
      --radius: 14px;
      --radius-sm: 11px;
      --radius-pill: 999px;
      --font: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --font-ui: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      --mono: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      --tap: 44px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --max: 36rem;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --focus: 0 0 0 3px color-mix(in srgb, var(--accent) 32%, transparent);
      --room-opacity: 0.42;
    }

    html[data-theme="dark"] {
      --bg: #141311;
      --bg-soft: #1b1916;
      --bg-elevated: #1f1d1a;
      --fg: #f0ebe3;
      --fg-muted: #a39e94;
      --fg-faint: #736e65;
      --border: #2e2b26;
      --border-strong: #433f37;
      --accent: #8fbc9f;
      --accent-soft: #243029;
      --accent-fg: #0f1612;
      --danger: #e8a399;
      --danger-soft: #2c1c19;
      --warn-bg: #2c2618;
      --warn-fg: #e8d7a4;
      --grid: color-mix(in srgb, var(--accent) 18%, var(--border));
      --shadow-sm: 0 1px 2px rgb(0 0 0 / 28%);
      --shadow-md: 0 10px 28px rgb(0 0 0 / 32%);
      --shadow-lg: 0 24px 60px rgb(0 0 0 / 48%);
      --room-opacity: 0.34;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      color-scheme: light dark;
    }

    body {
      margin: 0;
      min-height: 100%;
      color: var(--fg);
      font-family: var(--font-ui);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-text-size-adjust: 100%;
      padding-top: var(--safe-t);
      padding-bottom: calc(var(--safe-b) + 0.25rem);
      background: var(--bg);
    }

    /* Ambient isometric room corner (left wall vertical, right wall horizontal) */
    .room-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .room-bg::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(90% 60% at 70% 75%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 62%),
        radial-gradient(70% 50% at 20% 30%, color-mix(in srgb, var(--bg-soft) 70%, transparent), transparent 55%);
    }

    .room-bg svg {
      position: absolute;
      width: min(132vw, 46rem);
      height: auto;
      left: 50%;
      bottom: max(7rem, 18vh);
      transform: translateX(-42%);
      opacity: var(--room-opacity);
    }

    .app {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      min-height: 100dvh;
    }

    button, input, textarea {
      font: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      border-radius: var(--radius-sm);
      min-height: var(--tap);
      padding: 0.6rem 1rem;
      box-shadow: var(--shadow-sm);
      transition: background 0.15s var(--ease), border-color 0.15s var(--ease),
        transform 0.12s var(--ease), box-shadow 0.15s var(--ease), color 0.15s var(--ease);
      -webkit-tap-highlight-color: transparent;
      font-weight: 500;
    }

    @media (hover: hover) and (pointer: fine) {
      button:hover {
        border-color: var(--border-strong);
        background: color-mix(in srgb, var(--bg-elevated) 86%, var(--bg-soft));
      }
    }

    button:active { transform: translateY(1px); }

    button:focus-visible,
    input:focus-visible,
    textarea:focus-visible,
    .day-label:focus-visible {
      outline: none;
      box-shadow: var(--focus);
    }

    button.primary {
      background: var(--accent);
      color: var(--accent-fg);
      border-color: transparent;
      font-weight: 600;
      letter-spacing: 0.01em;
      box-shadow: 0 1px 0 color-mix(in srgb, #000 10%, transparent), var(--shadow-sm);
    }

    @media (hover: hover) and (pointer: fine) {
      button.primary:hover {
        background: color-mix(in srgb, var(--accent) 90%, #000);
        border-color: transparent;
      }
    }

    button.ghost {
      background: transparent;
      box-shadow: none;
      border-color: transparent;
      color: var(--fg-muted);
    }

    @media (hover: hover) and (pointer: fine) {
      button.ghost:hover {
        background: color-mix(in srgb, var(--fg) 6%, transparent);
        color: var(--fg);
        border-color: transparent;
      }
    }

    button.danger {
      color: var(--danger);
      background: var(--danger-soft);
      border-color: color-mix(in srgb, var(--danger) 20%, var(--border));
      box-shadow: none;
    }

    button.secondary {
      background: var(--bg-elevated);
      border-color: var(--border-strong);
      color: var(--fg);
      box-shadow: none;
    }

    button.icon {
      width: var(--tap);
      min-width: var(--tap);
      padding: 0;
      display: inline-grid;
      place-items: center;
      color: var(--fg-muted);
    }

    button.icon svg,
    .day-label svg {
      width: 1.2rem;
      height: 1.2rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.75;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .wrap {
      width: min(100% - 1.5rem, var(--max));
      margin-inline: auto;
    }

    /* Header: brand + single hamburger */
    header.app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 0.75rem 0 0.65rem;
      background: color-mix(in srgb, var(--bg) 82%, transparent);
      backdrop-filter: saturate(1.15) blur(14px);
      -webkit-backdrop-filter: saturate(1.15) blur(14px);
      border-bottom: 1px solid color-mix(in srgb, var(--border) 80%, transparent);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.85rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      min-width: 0;
    }

    .brand-mark {
      flex: 0 0 auto;
      width: 2.35rem;
      height: 2.35rem;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      color: var(--accent);
    }

    .brand-mark svg {
      width: 1.25rem;
      height: 1.25rem;
    }

    .brand-text { min-width: 0; }

    .brand h1 {
      margin: 0;
      font-family: var(--font);
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }

    #btn-menu {
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--fg);
      box-shadow: var(--shadow-sm);
    }

    #storage-warning,
    #backup-reminder {
      display: none;
      margin: 0.7rem auto 0;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius-sm);
      background: var(--warn-bg);
      color: var(--warn-fg);
      border: 1px solid color-mix(in srgb, var(--warn-fg) 18%, transparent);
      font-size: 0.86rem;
      line-height: 1.4;
    }

    #storage-warning.visible,
    #backup-reminder.visible { display: block; }

    #backup-reminder {
      display: none;
      background: var(--accent-soft);
      color: var(--fg);
      border-color: color-mix(in srgb, var(--accent) 25%, var(--border));
    }

    #backup-reminder.visible {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem 0.75rem;
      justify-content: space-between;
    }

    #backup-reminder p {
      margin: 0;
      flex: 1 1 12rem;
      font-size: 0.86rem;
      color: var(--fg-muted);
    }

    #backup-reminder .banner-actions {
      display: flex;
      gap: 0.35rem;
      flex: 0 0 auto;
    }

    #backup-reminder button {
      min-height: 2.25rem;
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
    }

    .menu-meta {
      margin: 0.35rem 0.15rem 0;
      font-size: 0.78rem;
      color: var(--fg-faint);
    }

    .menu-list button.danger-row {
      color: var(--danger);
      border-color: color-mix(in srgb, var(--danger) 22%, var(--border));
      background: var(--danger-soft);
    }

    .wipe-type-hint {
      margin: 0.35rem 0 0.55rem !important;
      font-size: 0.88rem !important;
      color: var(--fg) !important;
    }

    .wipe-type-hint code {
      font-family: var(--mono);
      font-size: 0.9em;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 0.1rem 0.35rem;
      border-radius: 6px;
      background: color-mix(in srgb, var(--danger) 12%, var(--bg));
      color: var(--danger);
    }

    .wipe-confirm-input {
      width: 100%;
      min-height: 2.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      padding: 0.55rem 0.75rem;
      font-family: var(--mono);
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .wipe-confirm-input:focus {
      outline: none;
      border-color: color-mix(in srgb, var(--danger) 45%, var(--border));
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--danger) 22%, transparent);
    }

    #btn-wipe-confirm:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Day bar: prev | open month calendar | next */
    .day-bar {
      display: grid;
      grid-template-columns: var(--tap) 1fr var(--tap);
      gap: 0.35rem;
      align-items: center;
      margin: 0.95rem auto 0.45rem;
    }

    .day-bar .icon {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elevated) 90%, transparent);
      color: var(--fg);
      box-shadow: var(--shadow-sm);
    }

    .day-label {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: var(--tap);
      width: 100%;
      padding: 0.45rem 0.75rem;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
      box-shadow: var(--shadow-sm);
      font-weight: 600;
      font-size: 0.95rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
      color: var(--fg);
      cursor: pointer;
    }

    .day-label .chev {
      color: var(--fg-faint);
      flex: 0 0 auto;
    }

    .day-label .is-today-dot {
      width: 0.4rem;
      height: 0.4rem;
      border-radius: 50%;
      background: var(--accent);
      flex: 0 0 auto;
    }

    /* Log */
    main#log {
      position: relative;
      padding: 0.55rem 0 8.5rem;
      min-height: 42vh;
      transition: padding-bottom 0.2s var(--ease);
    }

    body.composer-hidden main#log {
      padding-bottom: 6rem;
    }

    .entry:last-child {
      scroll-margin-bottom: 9rem;
    }

    body.composer-hidden .entry:last-child {
      scroll-margin-bottom: 6rem;
    }

    /* Full-page write mode: hide log & chrome so attention stays on "now" */
    body.composer-expanded main#log,
    body.composer-expanded .day-bar,
    body.composer-expanded .app-header,
    body.composer-expanded .room-bg {
      visibility: hidden;
      pointer-events: none;
    }

    .empty {
      margin: 2.5rem auto 1.25rem;
      max-width: 19rem;
      text-align: center;
      padding: 1.25rem 1rem 1.5rem;
    }

    .empty-room {
      width: min(100%, 14rem);
      margin: 0 auto 1.1rem;
      opacity: 0.9;
    }

    .empty-room svg {
      width: 100%;
      height: auto;
      display: block;
    }

    .empty p {
      margin: 0;
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--fg-muted);
    }

    .entry {
      position: relative;
      background: color-mix(in srgb, var(--bg-elevated) 94%, transparent);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 0.9rem 0.95rem 0.95rem;
      margin: 0 0 0.65rem;
      box-shadow: var(--shadow-sm);
      backdrop-filter: blur(6px);
    }

    .entry::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.8rem;
      bottom: 0.8rem;
      width: 3px;
      border-radius: 0 3px 3px 0;
      background: color-mix(in srgb, var(--accent) 50%, var(--border));
    }

    .entry-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.4rem;
    }

    .entry-time {
      font-family: var(--mono);
      font-size: 0.76rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
      background: color-mix(in srgb, var(--bg-soft) 65%, transparent);
      border: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
      border-radius: var(--radius-pill);
      padding: 0.2rem 0.55rem;
    }

    .entry-more {
      min-height: 2rem;
      width: 2rem;
      min-width: 2rem;
      padding: 0;
      border: none;
      box-shadow: none;
      background: transparent;
      color: var(--fg-faint);
      border-radius: 8px;
    }

    @media (hover: hover) and (pointer: fine) {
      .entry-more:hover {
        color: var(--fg);
        background: color-mix(in srgb, var(--fg) 6%, transparent);
      }
    }

    .entry-actions {
      display: none;
      gap: 0.4rem;
      margin-top: 0.65rem;
      padding-top: 0.65rem;
      border-top: 1px solid color-mix(in srgb, var(--border) 90%, transparent);
    }

    .entry.open .entry-actions { display: flex; }

    .entry-actions button {
      flex: 1;
      min-height: 2.4rem;
      font-size: 0.88rem;
    }

    .entry-text {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.48;
      letter-spacing: -0.01em;
    }

    .entry.editing .entry-text { display: none; }
    .entry.editing .entry-more { display: none; }

    .entry.editing textarea {
      width: 100%;
      min-height: 5.5rem;
      resize: vertical;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg);
      padding: 0.75rem 0.85rem;
      font-family: var(--font);
      font-size: 1.05rem;
      line-height: 1.45;
      margin-top: 0.25rem;
    }

    .entry-edit-actions {
      display: flex;
      gap: 0.45rem;
      margin-top: 0.6rem;
      justify-content: flex-end;
    }

    /* Composer — compact single-line dock; optional full-page expand */
    .composer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 30;
      padding: 0.5rem 0 calc(0.5rem + var(--safe-b));
      background: linear-gradient(to top, color-mix(in srgb, var(--bg) 97%, transparent) 45%, transparent);
      pointer-events: none;
    }

    .composer-shell {
      pointer-events: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--bg-elevated) 96%, transparent);
      backdrop-filter: blur(16px) saturate(1.1);
      -webkit-backdrop-filter: blur(16px) saturate(1.1);
      box-shadow: var(--shadow-md);
      padding: 0.45rem;
    }

    .composer-toolbar {
      display: none;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.15rem 0.25rem 0.55rem;
      border-bottom: 1px solid color-mix(in srgb, var(--border) 85%, transparent);
      margin-bottom: 0.45rem;
    }

    .composer-toolbar-text {
      min-width: 0;
    }

    .composer-toolbar h2 {
      margin: 0;
      font-family: var(--font);
      font-size: 1.08rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .composer-toolbar .composer-day {
      margin: 0.25rem 0 0;
      font-size: 0.8rem;
      color: var(--fg-muted);
      font-variant-numeric: tabular-nums;
    }

    .composer-toolbar .composer-hint-expanded {
      margin: 0.35rem 0 0;
      font-size: 0.75rem;
      color: var(--fg-faint);
      line-height: 1.35;
    }

    .composer-compact-row {
      display: flex;
      align-items: flex-end;
      gap: 0.35rem;
    }

    .btn-hide-composer {
      flex: 0 0 auto;
      min-height: 2.75rem;
      width: 2.4rem;
      min-width: 2.4rem;
      padding: 0;
      border: none;
      box-shadow: none;
      background: transparent;
      color: var(--fg-faint);
      border-radius: 10px;
    }

    @media (hover: hover) and (pointer: fine) {
      .btn-hide-composer:hover {
        color: var(--fg-muted);
        background: color-mix(in srgb, var(--fg) 6%, transparent);
      }
    }

    .composer.is-expanded .btn-hide-composer {
      display: none;
    }

    /* Reading mode: composer dock hidden, FAB restores write */
    body.composer-hidden .composer {
      display: none;
    }

    .fab-write {
      position: fixed;
      right: max(1rem, env(safe-area-inset-right, 0px));
      bottom: calc(1rem + var(--safe-b));
      z-index: 35;
      width: 3.5rem;
      height: 3.5rem;
      min-height: 3.5rem;
      min-width: 3.5rem;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      color: var(--accent-fg);
      box-shadow: var(--shadow-md), 0 4px 14px color-mix(in srgb, var(--accent) 28%, transparent);
      display: none;
      place-items: center;
      font-size: 1.75rem;
      font-weight: 400;
      line-height: 1;
    }

    body.composer-hidden .fab-write {
      display: grid;
    }

    .fab-write svg {
      width: 1.45rem;
      height: 1.45rem;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
    }

    body.composer-expanded .fab-write {
      display: none !important;
    }

    #composer-text {
      flex: 1;
      width: 100%;
      min-height: 2.75rem;
      max-height: 2.75rem;
      height: 2.75rem;
      resize: none;
      border: 1px solid transparent;
      border-radius: 12px;
      background: color-mix(in srgb, var(--bg) 50%, var(--bg-elevated));
      padding: 0.65rem 0.8rem;
      font-family: var(--font);
      font-size: 1.02rem;
      line-height: 1.35;
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 3%);
      overflow-x: auto;
      overflow-y: hidden;
      white-space: nowrap;
    }

    #composer-text::placeholder {
      color: var(--fg-faint);
      opacity: 1;
    }

    #composer-text:focus {
      border-color: color-mix(in srgb, var(--accent) 38%, var(--border));
      background: var(--bg-elevated);
      box-shadow: var(--focus);
      outline: none;
    }

    .composer-actions {
      display: flex;
      gap: 0.35rem;
      flex: 0 0 auto;
      align-items: center;
    }

    .composer-actions .primary {
      min-height: 2.75rem;
      min-width: 4.6rem;
      padding-inline: 0.9rem;
      border-radius: 12px;
    }

    .composer-actions .icon {
      min-height: 2.75rem;
      width: 2.75rem;
      min-width: 2.75rem;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--fg-muted);
      box-shadow: var(--shadow-sm);
    }

    .hint {
      display: none;
    }

    /* Full-page writing mode */
    body.composer-expanded {
      overflow: hidden;
    }

    .composer.is-expanded {
      inset: 0;
      z-index: 60;
      padding:
        calc(0.55rem + var(--safe-t))
        0
        calc(0.55rem + var(--safe-b));
      background: var(--bg);
      pointer-events: auto;
    }

    .composer.is-expanded .wrap {
      height: 100%;
    }

    .composer.is-expanded .composer-shell {
      height: 100%;
      display: flex;
      flex-direction: column;
      border-radius: 0;
      border: none;
      padding: 0.85rem 0.35rem 0.5rem;
      background: transparent;
      box-shadow: none;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
    }

    .composer.is-expanded .composer-toolbar {
      display: flex;
    }

    .composer.is-expanded .composer-compact-row {
      flex: 1;
      flex-direction: column;
      align-items: stretch;
      min-height: 0;
      gap: 0.65rem;
    }

    .composer.is-expanded #composer-text {
      flex: 1;
      min-height: 0;
      max-height: none;
      height: auto;
      white-space: pre-wrap;
      overflow-y: auto;
      overflow-x: hidden;
      font-size: 1.12rem;
      line-height: 1.5;
      padding: 0.9rem 1rem;
    }

    .composer.is-expanded .composer-actions {
      width: 100%;
    }

    .composer.is-expanded .composer-actions .primary {
      flex: 1;
      min-height: 2.9rem;
    }

    .composer.is-expanded .btn-expand {
      display: none;
    }

    .composer.is-expanded .btn-collapse {
      display: inline-grid;
    }

    .btn-collapse {
      display: none;
    }

    /* Dialogs */
    dialog {
      border: 1px solid var(--border);
      border-radius: 18px;
      background: var(--bg-elevated);
      color: var(--fg);
      padding: 0;
      width: min(calc(100% - 1.5rem), 22.5rem);
      box-shadow: var(--shadow-lg);
      max-height: min(90vh, 40rem);
    }

    dialog.cal-dialog {
      width: min(calc(100% - 1.25rem), 24rem);
    }

    dialog::backdrop {
      background: rgb(18 16 12 / 42%);
      backdrop-filter: blur(3px);
    }

    .dialog-body {
      padding: 1.15rem 1.15rem 0.75rem;
    }

    .dialog-body h2 {
      margin: 0 0 0.35rem;
      font-family: var(--font);
      font-size: 1.12rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .dialog-body > p {
      margin: 0 0 0.65rem;
      color: var(--fg-muted);
      font-size: 0.9rem;
    }

    .dialog-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;
      justify-content: flex-end;
      padding: 0 1.1rem 1.1rem;
    }

    .help-body {
      max-height: min(60vh, 28rem);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-right: 0.15rem;
    }

    .help-body h3 {
      margin: 1rem 0 0.35rem;
      font-family: var(--font-ui);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: var(--fg-muted);
    }

    .help-body h3:first-child {
      margin-top: 0.25rem;
    }

    .help-body p,
    .help-body li {
      margin: 0 0 0.45rem;
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--fg);
    }

    .help-body ul {
      margin: 0 0 0.35rem;
      padding-left: 1.15rem;
    }

    .help-body li {
      margin-bottom: 0.3rem;
    }

    .help-body a {
      color: var(--accent);
    }

    .menu-list {
      display: grid;
      gap: 0.35rem;
      margin: 0.75rem 0 0;
    }

    .menu-list button {
      width: 100%;
      text-align: left;
      justify-content: flex-start;
      border-radius: 12px;
      min-height: 2.85rem;
      padding-inline: 0.95rem;
    }

    .menu-list .row-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      width: 100%;
    }

    .menu-list .row-meta span:last-child {
      color: var(--fg-muted);
      font-size: 0.82rem;
      font-weight: 600;
    }

    .menu-sep {
      height: 1px;
      background: var(--border);
      margin: 0.45rem 0.15rem;
    }

    .menu-credit {
      margin: 0.9rem 0 0;
      font-size: 0.78rem;
      color: var(--fg-muted);
      line-height: 1.45;
    }

    .menu-credit a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    /* Month calendar */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-bottom: 0.75rem;
    }

    .cal-head h2 {
      margin: 0;
      flex: 1;
      text-align: center;
      font-size: 1rem;
      font-family: var(--font-ui);
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .cal-weekdays,
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.2rem;
    }

    .cal-weekdays span {
      text-align: center;
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--fg-faint);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 0.25rem 0 0.4rem;
    }

    .cal-grid button {
      aspect-ratio: 1;
      min-height: 0;
      height: auto;
      padding: 0;
      border-radius: 11px;
      border: 1px solid transparent;
      background: transparent;
      box-shadow: none;
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      font-weight: 500;
      position: relative;
      color: var(--fg);
    }

    .cal-grid button.muted {
      color: var(--fg-faint);
      opacity: 0.55;
    }

    .cal-grid button.has-entries::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: 0.28rem;
      width: 0.28rem;
      height: 0.28rem;
      border-radius: 50%;
      transform: translateX(-50%);
      background: var(--accent);
    }

    .cal-grid button.selected {
      background: var(--accent);
      color: var(--accent-fg);
      font-weight: 700;
    }

    .cal-grid button.selected.has-entries::after {
      background: var(--accent-fg);
    }

    .cal-grid button.today:not(.selected) {
      border-color: color-mix(in srgb, var(--accent) 45%, var(--border));
    }

    @media (hover: hover) and (pointer: fine) {
      .cal-grid button:hover:not(.selected) {
        background: color-mix(in srgb, var(--accent) 10%, transparent);
      }
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    body.composer-hidden .toast {
      bottom: calc(5.2rem + var(--safe-b));
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(6.2rem + var(--safe-b));
      transform: translateX(-50%) translateY(6px);
      z-index: 40;
      background: color-mix(in srgb, var(--fg) 94%, var(--accent));
      color: var(--bg);
      padding: 0.55rem 1rem;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s var(--ease), transform 0.22s var(--ease);
      max-width: min(90vw, 22rem);
      text-align: center;
      box-shadow: var(--shadow-md);
    }

    .toast.show {
      opacity: 0.96;
      transform: translateX(-50%) translateY(0);
    }

    @media (min-width: 640px) {
      .composer-actions .primary {
        min-width: 5.5rem;
      }
      .room-bg svg {
        width: min(78vw, 40rem);
        left: 52%;
        bottom: max(8rem, 16vh);
        transform: translateX(-40%);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>

  <div class="app">

  function defaultState() {
    return {
      version: 1,
      entries: [],

  function detectLang() {
    const nav = (navigator.language || "en").toLowerCase();
    return nav.startsWith("it") ? "it" : "en";
  }

  function t(key) {
    const lang = state.settings.lang === "it" ? "it" : "en";
    return I18N[lang][key] || I18N.en[key] || key;
  }

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const data = JSON.parse(raw);
      if (!data || typeof data !== "object") return;
      state = {
        version: 1,
        entries: Array.isArray(data.entries) ? data.entries.filter(isValidEntry) : [],
        settings: {
          theme: normalizeTheme(data.settings && data.settings.theme),
          lang:
            data.settings && data.settings.lang === "it"
              ? "it"
              : data.settings && data.settings.lang === "en"
                ? "en"
                : detectLang(),
          lastBackupAt:
            data.settings && typeof data.settings.lastBackupAt === "string"
              ? data.settings.lastBackupAt
              : null,
        },
      };
    } catch (_) {}
  }

  function normalizeTheme(v) {
    return v === "light" || v === "dark" || v === "system" ? v : "system";
  }

  function persist() {
    const payload = JSON.stringify({
      version: 1,
      entries: state.entries,
      settings: state.settings,
    });
    try {
      localStorage.setItem(STORAGE_KEY, payload);
    } catch (_) {}
    updateStorageWarning(payload.length);
  }

  function updateStorageWarning(bytes) {
    const show = bytes >= SOFT_BYTES || state.entries.length >= SOFT_COUNT;
    el.storageWarning.textContent = t("storageWarn");
    el.storageWarning.classList.toggle("visible", show);
    updateBackupReminder();
    updateLastBackupMeta();
  }

  function updateLastBackupMeta() {
    if (!el.lastBackupMeta) return;
    const last = state.settings.lastBackupAt;
    if (!last) {
      el.lastBackupMeta.textContent = t("lastBackupNever");
      return;
    }
    const d = new Date(last);
    const loc = state.settings.lang === "it" ? "it-IT" : "en-GB";
    const label = Number.isNaN(d.getTime())
      ? last
      : d.toLocaleString(loc, { dateStyle: "medium", timeStyle: "short" });
    el.lastBackupMeta.textContent = t("lastBackupAt").replace("{date}", label);
  }

  function updateBackupReminder() {
    if (!el.backupReminder) return;
    let dismissed = false;
    try {
      dismissed = sessionStorage.getItem(REMINDER_DISMISS_KEY) === "1";
    } catch (_) {}
    const show =
      !dismissed &&
      shouldShowBackupReminder(state.settings, state.entries.length, Date.now());
    el.backupReminderText.textContent = t("backupReminder");
    el.btnReminderBackup.textContent = t("backupReminderAction");
    el.btnReminderDismiss.textContent = t("backupReminderDismiss");
    el.backupReminder.classList.toggle("visible", show);
  }

  function localDateKey(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return y + "-" + m + "-" + day;
  }

  function parseLocalDay(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d, 12, 0, 0, 0);
  }

  function shiftDay(key, delta) {
    const d = parseLocalDay(key);
    d.setDate(d.getDate() + delta);
    return localDateKey(d);
  }

  function entryDayKey(entry) {
    const d = new Date(entry.ts);
    if (Number.isNaN(d.getTime())) return "";
    return localDateKey(d);
  }

  function formatTime(iso) {
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return "--:--";
    return d.toLocaleTimeString(state.settings.lang === "it" ? "it-IT" : "en-GB", {
      hour: "2-digit",
      minute: "2-digit",
      hour12: false,
    });
  }

  function formatDayLabel(key) {
    const d = parseLocalDay(key);
    const loc = state.settings.lang === "it" ? "it-IT" : "en-GB";
    return d.toLocaleDateString(loc, {
      weekday: "short",
      day: "numeric",
      month: "short",
      year: "numeric",
    });
  }

  function nowIso() {
    return isoFromDate(new Date());
  }

  function isoFromDate(d) {
    const pad = (n) => String(n).padStart(2, "0");
    const off = -d.getTimezoneOffset();
    const sign = off >= 0 ? "+" : "-";
    const oh = pad(Math.floor(Math.abs(off) / 60));
    const om = pad(Math.abs(off) % 60);
    return (
      d.getFullYear() +
      "-" + pad(d.getMonth() + 1) +
      "-" + pad(d.getDate()) +
      "T" + pad(d.getHours()) +
      ":" + pad(d.getMinutes()) +
      ":" + pad(d.getSeconds()) +
      sign + oh + ":" + om
    );
  }

  function uid() {
    if (crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
  }

  function entriesForDay(dayKey) {
    // Insertion / chronological order: oldest first, newest at the bottom.
    return state.entries
      .filter((e) => entryDayKey(e) === dayKey)
      .sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : 0));
  }

  function scrollToLatestEntry() {
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const behavior = reduce ? "auto" : "smooth";
    requestAnimationFrame(() => {
      const last = el.log.lastElementChild;
      if (last && last.classList.contains("entry")) {
        last.scrollIntoView({ behavior: behavior, block: "end" });
      } else {
        window.scrollTo({
          top: document.documentElement.scrollHeight,
          behavior: behavior,
        });
      }
    });
  }

  function daysWithEntries() {
    const set = new Set();
    for (const e of state.entries) {
      const k = entryDayKey(e);
      if (k) set.add(k);
    }
    return set;
  }

  function renderLog() {
    const list = entriesForDay(selectedDay);
    el.log.innerHTML = "";
    if (!list.length) {
      const empty = document.createElement("div");

      empty.innerHTML = emptyRoomSvg();
      const p = document.createElement("p");
      p.textContent = t("empty");
      empty.appendChild(p);
      el.log.appendChild(empty);
      return;
    }
    for (const entry of list) {
      el.log.appendChild(renderEntry(entry));
    }
  }

  function renderEntry(entry) {
    const card = document.createElement("article");
    card.className = "entry";
    if (editingId === entry.id) card.classList.add("editing");
    if (openEntryId === entry.id) card.classList.add("open");
    card.dataset.id = entry.id;

    const top = document.createElement("div");
    top.className = "entry-top";

    const time = document.createElement("div");
    time.className = "entry-time";
    time.textContent = formatTime(entry.ts);
    top.appendChild(time);

    if (editingId === entry.id) {
      const ta = document.createElement("textarea");
      ta.value = entry.text;
      ta.setAttribute("aria-label", t("edit"));

      const editActions = document.createElement("div");
      editActions.className = "entry-edit-actions";

      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.className = "ghost";
      cancel.textContent = t("cancel");
      cancel.addEventListener("click", () => {
        editingId = null;
        renderLog();
      });

      const save = document.createElement("button");
      save.type = "button";
      save.className = "primary";
      save.textContent = t("saveEdit");
      save.addEventListener("click", () => {
        const text = ta.value.replace(/\s+$/g, "");
        if (!text.trim()) return;
        updateEntry(entry.id, text);
        editingId = null;
        openEntryId = null;
        renderLog();
        toast(t("saved"));
      });

      editActions.append(cancel, save);
      card.append(top, ta, editActions);
      queueMicrotask(() => ta.focus());
      return card;
    }

    const more = document.createElement("button");
    more.type = "button";
    more.className = "entry-more icon";
    more.setAttribute("aria-label", t("more"));
    more.innerHTML =
      '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="6" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.15" fill="currentColor" stroke="none"/><circle cx="12" cy="18" r="1.15" fill="currentColor" stroke="none"/></svg>';
    more.addEventListener("click", (e) => {
      e.stopPropagation();
      openEntryId = openEntryId === entry.id ? null : entry.id;
      renderLog();
    });
    top.appendChild(more);

    const body = document.createElement("p");
    body.className = "entry-text";
    body.textContent = entry.text;

    const actions = document.createElement("div");
    actions.className = "entry-actions";

    const btnEdit = document.createElement("button");
    btnEdit.type = "button";
    btnEdit.className = "secondary";
    btnEdit.textContent = t("edit");
    btnEdit.addEventListener("click", () => {
      editingId = entry.id;
      openEntryId = null;
      renderLog();
    });

    const btnDel = document.createElement("button");
    btnDel.type = "button";
    btnDel.className = "danger";
    btnDel.textContent = t("delete");
    btnDel.addEventListener("click", async () => {
      const ok = await askConfirm(t("deleteTitle"), t("deleteMsg"), t("delete"));
      if (!ok) return;
      deleteEntry(entry.id);
      openEntryId = null;
      renderLog();
    });

    actions.append(btnEdit, btnDel);
    card.append(top, body, actions);
    return card;
  }

  function saveComposer() {
    const text = el.composer.value.replace(/\s+$/g, "");
    if (!text.trim()) return;

    const today = localDateKey(new Date());
    let ts = nowIso();
    if (selectedDay !== today) {
      const d = parseLocalDay(selectedDay);
      const now = new Date();
      d.setHours(now.getHours(), now.getMinutes(), now.getSeconds(), now.getMilliseconds());
      ts = isoFromDate(d);
    }

    state.entries.push({ id: uid(), ts: ts, updatedAt: null, text: text });
    persist();
    el.composer.value = "";
    openEntryId = null;
    setComposerExpanded(false);
    renderLog();
    scrollToLatestEntry();
    toast(t("saved"));
  }

  function isComposerExpanded() {
    return el.composerRoot.classList.contains("is-expanded");
  }

  function isComposerHidden() {
    return document.body.classList.contains("composer-hidden");
  }

  /** Reading mode: hide dock. Default on load is always visible (low write friction). */
  function setComposerHidden(hidden) {
    if (hidden) {
      setComposerExpanded(false);
    }
    document.body.classList.toggle("composer-hidden", hidden);
    if (!hidden) {
      queueMicrotask(() => {
        el.composer.focus();
      });
    }
  }

  function scrollPageToTop() {
    // iOS: after reading the log, scrollY stays high; full-page expand + keyboard
    // then shows the bottom (Save) while the caret at the top is off-screen.
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    try {
      window.scrollTo({ top: 0, left: 0, behavior: reduce ? "auto" : "instant" in window ? "instant" : "auto" });
    } catch (_) {
      window.scrollTo(0, 0);
    }
    document.documentElement.scrollTop = 0;
    document.body.scrollTop = 0;
  }

  function setComposerExpanded(on) {
    if (on) {
      // Cannot expand while in read-only dock-hidden mode
      document.body.classList.remove("composer-hidden");
      scrollPageToTop();
    }
    el.composerRoot.classList.toggle("is-expanded", on);
    document.body.classList.toggle("composer-expanded", on);
    el.composer.setAttribute("rows", on ? "12" : "1");
    el.composer.setAttribute("enterkeyhint", on ? "enter" : "send");
    if (on) {
      el.composerDay.textContent = formatDayLabel(selectedDay);
      el.composerExpandTitle.textContent = t("expandTitle");
      el.composerHintExpanded.textContent = t("expandHint");
      // Double rAF: wait for layout after expand class, then focus
      requestAnimationFrame(() => {
        scrollPageToTop();
        requestAnimationFrame(() => {
          el.composer.focus({ preventScroll: false });
          const len = el.composer.value.length;
          try {
            el.composer.setSelectionRange(len, len);
          } catch (_) {}
          // Keep caret region visible inside the textarea if needed
          try {
            el.composer.scrollTop = 0;
          } catch (_) {}
        });
      });
    }
  }

  function updateEntry(id, text) {
    const e = state.entries.find((x) => x.id === id);
    if (!e) return;
    e.text = text;
    e.updatedAt = nowIso();
    persist();
  }

  function deleteEntry(id) {
    state.entries = state.entries.filter((x) => x.id !== id);
    if (editingId === id) editingId = null;
    persist();
  }

  function buildBackupBlob() {
    const payload = buildBackup(
      { entries: state.entries, settings: state.settings },
      nowIso()
    );
    const text = serializeBackup(payload);
    const name = backupFilename(new Date());
    const blob = new Blob([text], { type: "application/json" });
    return { blob, name, text };
  }

  function triggerDownload(blob, name) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function noteSafetyCopyDone() {
    state.settings = markBackupDone(state.settings, nowIso());
    try {
      sessionStorage.removeItem(REMINDER_DISMISS_KEY);
    } catch (_) {}
    persist();
    updateBackupReminder();
    updateLastBackupMeta();
  }

  /** P1: share-first safety copy, download fallback */
  async function saveSafetyCopy() {
    const { blob, name } = buildBackupBlob();
    const file = new File([blob], name, { type: "application/json" });
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({
          files: [file],
          title: "Liminal Journal",
          text: t("download"),
        });
        noteSafetyCopyDone();
        toast(t("copyShared"));
        return;
      }
    } catch (err) {
      if (err && err.name === "AbortError") {
        toast(t("copyCancelled"));
        return;
      }
      // fall through to download
    }
    triggerDownload(blob, name);
    noteSafetyCopyDone();
    toast(t("copySaved"));
  }

  /** @deprecated name kept for clarity in older call sites */
  function downloadBackup() {
    return saveSafetyCopy();
  }

  function wipeKeyword() {
    return t("wipeKeyword");
  }

  function syncWipeConfirmEnabled() {
    const expected = wipeKeyword();
    const typed = (el.wipeConfirmInput.value || "").trim();
    // Case-insensitive so mobile keyboards are less painful; still must match the word.
    el.btnWipeConfirm.disabled = typed.toLocaleUpperCase() !== expected.toLocaleUpperCase();
  }

  function askWipeConfirm() {
    el.wipeDialogTitle.textContent = t("wipeTitle");
    el.wipeDialogMessage.textContent = t("wipeMsg");
    const word = wipeKeyword();
    el.wipeTypeHint.innerHTML = t("wipeTypeHint").replace(
      "{word}",
      "<code>" + word + "</code>"
    );
    el.wipeInputLabel.textContent = t("wipeInputLabel");
    el.btnWipeCancel.textContent = t("cancel");
    el.btnWipeConfirm.textContent = t("wipeConfirm");
    el.wipeConfirmInput.value = "";
    el.wipeConfirmInput.placeholder = word;
    syncWipeConfirmEnabled();
    el.wipeDialog.showModal();
    queueMicrotask(() => el.wipeConfirmInput.focus());
    return new Promise((resolve) => {
      wipeResolver = resolve;
    });
  }

  function finishWipeDialog(ok) {
    if (el.wipeDialog.open) el.wipeDialog.close();
    if (wipeResolver) {
      const r = wipeResolver;
      wipeResolver = null;
      r(ok);
    }
  }

  async function wipeAllEntries() {
    const ok = await askWipeConfirm();
    if (!ok) return;
    const cleared = clearAllEntries(state);
    state.entries = cleared.entries;
    editingId = null;
    openEntryId = null;
    persist();
    renderLog();
    toast(t("wiped"));
  }

  function dayPlainText(dayKey) {
    const list = entriesForDay(dayKey); // already chronological
    const lines = list.map((e) => formatTime(e.ts) + " — " + e.text);
    return "Liminal Journal — " + dayKey + "\n\n" + (lines.length ? lines.join("\n\n") : "");
  }

  async function shareDay() {
    const text = dayPlainText(selectedDay);
    const title = "Liminal Journal — " + selectedDay;
    if (navigator.share) {
      try {
        await navigator.share({ title: title, text: text });
        toast(t("shared"));
        return;
      } catch (err) {
        if (err && err.name === "AbortError") return;
      }
    }
    try {
      await navigator.clipboard.writeText(text);
      toast(t("copied"));
    } catch (_) {
      const blob = new Blob([text], { type: "text/plain" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "liminal-journal-" + selectedDay + ".txt";
      a.click();
      URL.revokeObjectURL(a.href);
      toast(t("downloaded"));
    }
  }

  function openRestorePicker() {
    el.fileInput.value = "";
    el.fileInput.click();
  }

  function onFileChosen(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = parseBackup(String(reader.result || ""));
        if (!data.entries.length) {
          toast(t("restoreEmpty"));
          return;
        }
        const range = summarizeEntryRange(data.entries, (ts) => {
          const d = new Date(ts);
          if (Number.isNaN(d.getTime())) return "";
          return localDateKey(d);
        });
        pendingRestore = { entries: data.entries, settings: data.settings || null };
        el.restoreSummary.textContent = t("restoreSummary")
          .replace("{count}", String(range.count))
          .replace("{from}", range.from || "—")
          .replace("{to}", range.to || "—");
        el.restoreDialog.showModal();
      } catch (_) {
        toast(t("restoreBad"));
      }
    };
    reader.readAsText(file);
  }

  function mergeRestore() {
    if (!pendingRestore) return;
    const result = mergeEntries(state.entries, pendingRestore.entries);
    state.entries = result.entries;
    pendingRestore = null;
    persist();
    el.restoreDialog.close();
    renderLog();
    toast(
      t("restored") +
        " — " +
        t("restoreMergeStats")
          .replace("{added}", String(result.added))
          .replace("{updated}", String(result.updated))
          .replace("{unchanged}", String(result.unchanged))
    );
  }

  async function replaceRestore() {
    if (!pendingRestore) return;
    const ok = await askConfirm(t("replaceConfirmTitle"), t("replaceConfirmMsg"), t("replace"));
    if (!ok) return;
    const result = replaceEntries(pendingRestore.entries);
    state.entries = result.entries;
    if (pendingRestore.settings) {
      state.settings.theme = normalizeTheme(pendingRestore.settings.theme);
      if (pendingRestore.settings.lang === "it" || pendingRestore.settings.lang === "en") {
        state.settings.lang = pendingRestore.settings.lang;
      }
      if (typeof pendingRestore.settings.lastBackupAt === "string") {
        state.settings.lastBackupAt = pendingRestore.settings.lastBackupAt;
      }
    }
    pendingRestore = null;
    persist();
    applyTheme();
    applyI18n();
    el.restoreDialog.close();
    renderLog();
    toast(t("restored"));
  }

  function askConfirm(title, message, okLabel) {
    el.confirmTitle.textContent = title;
    el.confirmMessage.textContent = message;
    el.btnConfirmCancel.textContent = t("cancel");
    el.btnConfirmOk.textContent = okLabel || t("confirmOk");
    el.confirmDialog.showModal();
    return new Promise((resolve) => {
      confirmResolver = resolve;
    });
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.toast.classList.remove("show"), 1800);
  }

  function cycleTheme() {
    const order = ["system", "light", "dark"];
    const i = order.indexOf(state.settings.theme);
    state.settings.theme = order[(i + 1) % order.length];
    persist();
    applyTheme();
    el.themeValue.textContent = themeLabel();
  }

  function toggleLang() {
    state.settings.lang = state.settings.lang === "it" ? "en" : "it";
    persist();
    applyI18n();
    renderLog();
  }

  function openCalendar() {
    const d = parseLocalDay(selectedDay);
    calMonth = new Date(d.getFullYear(), d.getMonth(), 1);
    renderCalWeekdays();
    renderCalendar();
    el.calDialog.showModal();
  }

  function renderCalWeekdays() {
    const loc = state.settings.lang === "it" ? "it-IT" : "en-GB";
    // Monday-first
    const base = new Date(Date.UTC(2021, 0, 4)); // Monday
    el.calWeekdays.innerHTML = "";
    for (let i = 0; i < 7; i++) {
      const d = new Date(base);
      d.setUTCDate(base.getUTCDate() + i);
      const span = document.createElement("span");
      span.textContent = d.toLocaleDateString(loc, { weekday: "narrow" });
      el.calWeekdays.appendChild(span);
    }
  }

  function renderCalendar() {
    const loc = state.settings.lang === "it" ? "it-IT" : "en-GB";
    el.calMonthLabel.textContent = calMonth.toLocaleDateString(loc, {
      month: "long",
      year: "numeric",
    });

    const year = calMonth.getFullYear();
    const month = calMonth.getMonth();
    const first = new Date(year, month, 1);
    // Monday=0 … Sunday=6
    let startPad = (first.getDay() + 6) % 7;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const prevDays = new Date(year, month, 0).getDate();
    const marked = daysWithEntries();
    const todayKey = localDateKey(new Date());

    el.calGrid.innerHTML = "";
    const totalCells = 42;

    for (let i = 0; i < totalCells; i++) {
      let dayNum;
      let cellMonth = month;
      let cellYear = year;
      let muted = false;

      if (i < startPad) {
        dayNum = prevDays - startPad + i + 1;
        cellMonth = month - 1;
        if (cellMonth < 0) {
          cellMonth = 11;
          cellYear = year - 1;
        }
        muted = true;
      } else if (i >= startPad + daysInMonth) {
        dayNum = i - (startPad + daysInMonth) + 1;
        cellMonth = month + 1;
        if (cellMonth > 11) {
          cellMonth = 0;
          cellYear = year + 1;
        }
        muted = true;
      } else {
        dayNum = i - startPad + 1;
      }

      const key =
        cellYear +
        "-" +
        String(cellMonth + 1).padStart(2, "0") +
        "-" +
        String(dayNum).padStart(2, "0");

      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = String(dayNum);
      btn.setAttribute("role", "gridcell");
      if (muted) btn.classList.add("muted");
      if (key === selectedDay) btn.classList.add("selected");
      if (key === todayKey) btn.classList.add("today");
      if (marked.has(key)) btn.classList.add("has-entries");
      btn.addEventListener("click", () => {
        setSelectedDay(key);
        el.calDialog.close();
      });
      el.calGrid.appendChild(btn);
    }
  }

  function shiftCalMonth(delta) {
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
    renderCalendar();
  }

  function bind() {
    el.btnSave.addEventListener("click", saveComposer);
    el.btnExpand.addEventListener("click", () => setComposerExpanded(true));
    el.btnCollapse.addEventListener("click", () => setComposerExpanded(false));
    el.btnHideComposer.addEventListener("click", () => setComposerHidden(true));
    el.btnShowComposer.addEventListener("click", () => setComposerHidden(false));
    el.composer.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && isComposerExpanded()) {
        e.preventDefault();
        setComposerExpanded(false);
        return;
      }
      // Compact: Enter saves. Expanded: Cmd/Ctrl+Enter saves; Enter = newline.
      if (e.key === "Enter") {
        if (isComposerExpanded()) {
          if (e.metaKey || e.ctrlKey) {
            e.preventDefault();
            saveComposer();
          }
          return;
        }
        if (!e.shiftKey) {
          e.preventDefault();
          saveComposer();
        }
      }
    });

    el.btnPrev.addEventListener("click", () => setSelectedDay(shiftDay(selectedDay, -1)));
    el.btnNext.addEventListener("click", () => setSelectedDay(shiftDay(selectedDay, 1)));
    el.btnOpenCal.addEventListener("click", openCalendar);

    el.btnCalPrev.addEventListener("click", () => shiftCalMonth(-1));
    el.btnCalNext.addEventListener("click", () => shiftCalMonth(1));
    el.btnCalClose.addEventListener("click", () => el.calDialog.close());
    el.btnCalToday.addEventListener("click", () => {
      setSelectedDay(localDateKey(new Date()));
      el.calDialog.close();
    });

    el.btnTheme.addEventListener("click", cycleTheme);
    el.btnLang.addEventListener("click", toggleLang);

    el.btnMenu.addEventListener("click", () => el.menuDialog.showModal());
    el.btnMenuClose.addEventListener("click", () => el.menuDialog.close());
    el.btnHelp.addEventListener("click", () => {
      el.menuDialog.close();
      openHelp();
    });
    el.btnHelpClose.addEventListener("click", () => el.helpDialog.close());
    el.btnDownload.addEventListener("click", () => {
      el.menuDialog.close();
      saveSafetyCopy();
    });
    el.btnRestore.addEventListener("click", () => {
      el.menuDialog.close();
      openRestorePicker();
    });
    el.btnShareDay.addEventListener("click", () => {
      el.menuDialog.close();
      shareDay();
    });
    el.btnWipeAll.addEventListener("click", () => {
      el.menuDialog.close();
      wipeAllEntries();
    });
    el.btnReminderBackup.addEventListener("click", () => {
      saveSafetyCopy();
    });
    el.btnReminderDismiss.addEventListener("click", () => {
      dismissBackupReminder();
    });

    el.fileInput.addEventListener("change", () => {
      const f = el.fileInput.files && el.fileInput.files[0];
      onFileChosen(f);
    });

    el.btnRestoreCancel.addEventListener("click", () => {
      pendingRestore = null;
      el.restoreDialog.close();
    });
    el.btnRestoreMerge.addEventListener("click", mergeRestore);
    el.btnRestoreReplace.addEventListener("click", replaceRestore);

    el.btnConfirmCancel.addEventListener("click", () => {
      el.confirmDialog.close();
      if (confirmResolver) {
        confirmResolver(false);
        confirmResolver = null;
      }
    });
    el.btnConfirmOk.addEventListener("click", () => {
      el.confirmDialog.close();
      if (confirmResolver) {
        confirmResolver(true);
        confirmResolver = null;
      }
    });
    el.confirmDialog.addEventListener("close", () => {
      if (confirmResolver) {
        confirmResolver(false);
        confirmResolver = null;
      }
    });

    el.wipeConfirmInput.addEventListener("input", syncWipeConfirmEnabled);
    el.wipeConfirmInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        if (!el.btnWipeConfirm.disabled) finishWipeDialog(true);
      }
    });
    el.btnWipeCancel.addEventListener("click", () => finishWipeDialog(false));
    el.btnWipeConfirm.addEventListener("click", () => {
      if (!el.btnWipeConfirm.disabled) finishWipeDialog(true);
    });
    el.wipeDialog.addEventListener("close", () => {
      if (wipeResolver) {
        const r = wipeResolver;
        wipeResolver = null;
        r(false);
      }
    });

    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
      if (state.settings.theme === "system") applyTheme();
    });
  }

  function init() {
    load();
    bind();
    applyTheme();
    applyI18n();
    setSelectedDay(localDateKey(new Date()));
    try {
      updateStorageWarning((localStorage.getItem(STORAGE_KEY) || "").length);
    } catch (_) {
      updateStorageWarning(0);
    }
  }

  init();
  </script>
</body>
</html>
